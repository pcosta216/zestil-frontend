# =============================================================================
# Curated cuisine/dish content — SEED SOURCE, not read live by the app.
# =============================================================================
# This file is the authoring source for two DB sections in
# tbl_onboarding_content: curated:cuisine.sub_cuisines and
# curated:cuisine.dishes. The onboarding engine reads those DB rows at
# runtime, not this file — edit this file, then regenerate the migration
# seed (see scripts/onboarding-seed/generate-seed-sql.mjs), rather than
# expecting an edit here to take effect on its own.
#
# Same {value, label} contract as every other options list in this flow —
# value is the slug the engine matches on, label is exact display text.
# id_order is assigned at generation time from array position (10, 20, 30, ...).
#
# NOT meant to be exhaustive at the cuisine/sub-cuisine level. All 7 non-
# "other" values from n_cuisine_broad have a sub_cuisines entry here
# (asian, european, american, latin_american, middle_eastern, mediterranean,
# african), but coverage within each is partial — anything missing (Bolivian,
# Austrian, most sub-cuisines under any given broad category, etc.) is
# expected to fall through to the DB tool or web search — the intended
# long-tail path, not a bug. Every sub_cuisine option here has a matching
# dish list — no sub-cuisine should dead-end into an empty dish deck.
# =============================================================================

