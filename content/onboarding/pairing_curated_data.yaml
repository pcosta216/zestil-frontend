# =============================================================================
# Curated pairing content — SEED SOURCE, not read live by the app.
# =============================================================================
# Authoring source for curated:pairing.sides. Nested cuisine_broad ->
# cuisine_narrow -> dish, mirroring cuisine_curated_data.yaml's own
# structure — but the nesting is ORGANIZATIONAL only, not a lookup key.
# n_pairing_cards' sample_from samples by BROAD cuisine alone (the top
# level); the engine doesn't care which cuisine_narrow bucket a dish sits
# in when picking — it just needs "every dish under this broad cuisine,"
# regardless of depth. The nesting exists so a human editing this file can
# see which cuisine a dish conceptually belongs to and add new ones in the
# right neighborhood, matching how cuisine_curated_data.yaml is organized.
# Dish keys must be unique across the ENTIRE file, not just within one
# cuisine branch — sample_from's cache (meal_planning_preferences.
# pairing_sample) stores the sampled dish's bare `value`, so a collision
# across branches would be ambiguous.
#
# This file is fully INDEPENDENT of cuisine_curated_data.yaml's own
# `dishes` table — n_pairing_cards never reads favorite_dishes or
# preferred_recipes, only taste_profile.cuisines (broad picks). A dish
# curated here does not need a matching entry in cuisine_curated_data.yaml,
# and vice versa; see pairing_cards_design.md §1 for why this node stopped
# being "show cards for dishes you said you like" and became a sampled
# preference-profiling exercise instead.
#
# Every dish has exactly 4 sides (a 4th was added across the board
# specifically to give the multi_select screen format more signal per
# screen than the original 3-option swipe-card version had).
#
# --- coverage — read this before assuming every cuisine works the same way ---
# african (19 dishes) and asian (7) never need generate_pairing_cards'
# top-up (a stub this phase — see engine.ts's resolveEntry sample_from
# handling). european (4), american (3), middle_eastern (3), and
# latin_american (2) fall short of a 6-dish share whenever picked alone;
# mediterranean has NO dedicated pool at all (its dishes live under
# european/middle_eastern per cuisine_curated_data.yaml's deliberate
# sub-cuisine overlap), so a mediterranean-only sample currently relies
# entirely on the (stub) top-up tool and will come up short this phase.
# Expected, not a bug — same "grow curated coverage with usage data"
# posture as every other curated file in this flow.
#
# --- the `_side` suffix ------------------------------------------------
# A handful of side values carry a `_side` suffix (guacamole_side,
# mac_and_cheese_side, falafel_side, hummus_side, tabbouleh_side,
# spring_rolls_side, collard_greens_side, cornbread_side, pounded_yam_side,
# egusi_soup_side, couscous_side, tagine_side, bbq_ribs_side, gumbo_side,
# patatas_bravas_side, funge_side, muamba_de_galinha_side) purely to avoid
# colliding with the SAME string used as a dish `value` elsewhere in this
# same file (e.g. "falafel" is both a main dish and a common side for
# hummus). Value-namespace uniqueness hack ONLY — never read/branched on
# by the engine. Recipe resolution (once real tooling exists) MUST search
# using the option's `label` ("Hummus"), never the raw `value`
# ("hummus_side") — this phase writes recipe_uuid: null regardless (see
# engine.ts's pairing_cards writeNodeAnswer branch), so this only matters
# once resolve_recipe_uuid is actually implemented.
# =============================================================================

